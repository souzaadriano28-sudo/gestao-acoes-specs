name: OpenSpec quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: openspec-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out specifications
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked OpenSpec CLI
        run: npm ci --ignore-scripts

      - name: Validate all OpenSpec content strictly
        run: npm run validate:openspec

      - name: Summarize OpenSpec validation
        if: always()
        run: |
          echo "### OpenSpec quality" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revision: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Command: \`openspec validate --all --strict --no-interactive\`" >> "$GITHUB_STEP_SUMMARY"
