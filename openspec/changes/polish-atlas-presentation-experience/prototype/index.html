<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Carteira — protótipo de polimento</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-dashboard" viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6V11h-6v9Zm0-16v4h6V4h-6Z"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 6.5h14a2 2 0 0 1 2 2V19H5a2 2 0 0 1-2-2V7a3 3 0 0 1 3-3h11v2.5H6a1.5 1.5 0 0 0 0 3h14"/><path d="M16 13h4v4h-4a2 2 0 0 1 0-4Z"/></symbol>
    <symbol id="i-asset" viewBox="0 0 24 24"><path d="M4 19V9m5 10V5m6 14v-7m5 7V3"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><path d="M3 20h18M5 20V8l7-4 7 4v12M9 11h1m4 0h1m-6 4h1m4 0h1"/></symbol>
    <symbol id="i-operation" viewBox="0 0 24 24"><path d="M7 7h12m0 0-3-3m3 3-3 3M17 17H5m0 0 3 3m-3-3 3-3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
  </svg>
  <div id="app"></div>
  <script>
    const screen = new URLSearchParams(location.search).get('screen') || 'dashboard';
    const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
    const nav = [
      ['dashboard','dashboard','Visão geral'], ['wallet','carteira','Carteira'], ['asset','acoes','Ações'],
      ['building','corretoras','Corretoras'], ['operation','operacoes','Operações']
    ];
    const shell = content => `<div class="shell"><aside class="rail"><div class="brand"><span class="atlas-mark"><i></i></span><span><b>Atlas</b><small>Carteira</small></span></div><nav>${nav.map(([i,r,l])=>`<a class="${screen===r?'active':''}" href="#">${icon(i)}<span>${l}</span></a>`).join('')}</nav><div class="rail-note"><b>Ambiente acadêmico</b><span>Registros simulados</span></div></aside><div class="workspace"><header class="topbar"><div class="mobile-brand"><span class="atlas-mark"><i></i></span><b>Atlas</b></div><span class="prototype-label">Dados simulados para protótipo</span><button class="user">AS</button></header>${content}<footer>Simulação acadêmica · Não executa ordens nem constitui recomendação.</footer></div><nav class="bottom-nav">${nav.map(([i,r,l])=>`<a class="${screen===r?'active':''}" href="#">${icon(i)}<span>${l}</span></a>`).join('')}</nav></div>`;

    const status = (label='Atualizado', tone='ok') => `<span class="status ${tone}"><i></i>${label}</span>`;
    const pageHead = (kicker,title,description,action='') => `<header class="page-head"><div><span>${kicker}</span><h1>${title}</h1><p>${description}</p></div>${action}</header>`;
    const dashboard = () => shell(`<main>${pageHead('Visão geral','Sua carteira','Posições e valores confirmados pelo backend.',`<div class="head-actions"><button class="secondary">${icon('refresh')}Atualizar</button><button class="primary">${icon('plus')}Registrar operação</button></div>`)}
      <section class="summary-grid"><article class="hero-card"><div class="contour"></div><div class="metric-label"><span>Patrimônio estimado</span>${status()}</div><strong>R$ 1.775,00</strong><p>Consolidado em BRL · 06 set, 23:44</p></article><article class="metric"><span>Custo das posições</span><strong>R$ 1.775,00</strong><small>Base investida</small></article><article class="metric"><span>Resultado não realizado</span><strong>R$ 0,00</strong><small>Sem variação</small></article><article class="metric positions"><span>Posições ativas</span><strong>2</strong><small>ativo–corretora</small></article></section>
      <section class="content-grid"><article class="surface positions-panel"><div class="section-head"><div><span class="kicker">COMPOSIÇÃO ATUAL</span><h2>Principais posições</h2></div><a href="#">Ver carteira</a></div><div class="asset-table"><div class="table-head"><span>Ativo</span><span>Quantidade</span><span>Preço médio</span><span>Valor atual</span><span>Resultado</span></div><div class="asset-row"><div><b>AAPL</b><small>NASDAQ · USD</small></div><span>3</span><span>US$ 100,00</span><span>US$ 300,00</span><span>US$ 0,00</span></div><div class="asset-row"><div><b>PETR4</b><small>B3 · BRL</small></div><span>10</span><span>R$ 20,00</span><span>R$ 200,00</span><span>R$ 0,00</span></div></div></article>
      <article class="surface movement-panel"><div class="section-head"><div><span class="kicker">ATIVIDADE</span><h2>Movimentações</h2></div><a href="#">Ver todas</a></div><div class="movement"><i class="sell">↑</i><div><b>Venda · PETR4</b><small>Hoje, 02:40 · Corretora Teste</small></div><span>2 × R$ 20,00</span></div><div class="movement"><i>↓</i><div><b>Compra · AAPL</b><small>Hoje, 02:40 · Corretora Teste</small></div><span>3 × US$ 100,00</span></div><div class="movement"><i>↓</i><div><b>Compra · PETR4</b><small>Hoje, 02:40 · Corretora Teste</small></div><span>12 × R$ 20,00</span></div></article></section>
      <details class="quality"><summary><div>${status('Dados atualizados')}<span>Cotações e câmbio verificados às 23:44</span></div>${icon('chevron')}</summary><div class="quality-details"><p><b>BRAPI</b> · referência 23:40 · coleta 23:44</p><p><b>TWELVE_DATA</b> · referência 23:40 · coleta 23:44</p><p><b>PTAX BCB</b> · referência 13:00 · coleta 23:44</p></div></details></main>`);

    const carteira = () => shell(`<main>${pageHead('Patrimônio','Carteira','Duas posições confirmadas em uma corretora.',`<button class="secondary">${icon('refresh')}Atualizar</button>`)}<details class="filter-bar" open><summary><b>Filtrar e ordenar</b><span>Nenhum filtro ativo ${icon('chevron')}</span></summary><div class="filters"><label><span>Buscar</span><input placeholder="Ativo ou corretora"></label><label><span>Mercado</span><select><option>Todos</option></select></label><label><span>Corretora</span><select><option>Todas</option></select></label><label><span>Ordenar</span><select><option>Ativo</option></select></label><button class="primary">Aplicar</button></div></details><article class="surface portfolio"><div class="section-head"><div><span class="kicker">2 POSIÇÕES</span><h2>Posições detalhadas</h2></div>${status()}</div><div class="asset-table detailed"><div class="table-head"><span>Ativo</span><span>Corretora</span><span>Qtd.</span><span>Preço médio</span><span>Cotação</span><span>Valor atual</span><span>Resultado</span></div><div class="asset-row"><div><b>AAPL</b><small>NASDAQ · USD</small></div><span>Corretora Teste</span><span>3</span><span>US$ 100,00</span><span>US$ 100,00</span><span>US$ 300,00</span><span>US$ 0,00</span></div><div class="asset-row"><div><b>PETR4</b><small>B3 · BRL</small></div><span>Corretora Teste</span><span>10</span><span>R$ 20,00</span><span>R$ 20,00</span><span>R$ 200,00</span><span>R$ 0,00</span></div></div><div class="mobile-assets"><article><header><div><b>AAPL</b><small>NASDAQ · Corretora Teste</small></div>${status()}</header><dl><div><dt>Valor atual</dt><dd>US$ 300,00</dd></div><div><dt>Resultado</dt><dd>US$ 0,00</dd></div><div><dt>Quantidade</dt><dd>3</dd></div><div><dt>Preço médio</dt><dd>US$ 100,00</dd></div></dl></article><article><header><div><b>PETR4</b><small>B3 · Corretora Teste</small></div>${status()}</header><dl><div><dt>Valor atual</dt><dd>R$ 200,00</dd></div><div><dt>Resultado</dt><dd>R$ 0,00</dd></div><div><dt>Quantidade</dt><dd>10</dd></div><div><dt>Preço médio</dt><dd>R$ 20,00</dd></div></dl></article></div></article></main>`);

    const operacoes = () => shell(`<main>${pageHead('Registros simulados','Operações','Registre uma compra ou venda; o preço é consultado pelo backend.',`<button class="secondary">${icon('refresh')}Reconciliar</button>`)}<div class="operations-layout"><article class="surface operation"><div class="step"><span>1</span><div><b>Nova operação</b><small>Revise os dados antes de confirmar</small></div></div><fieldset><legend>Tipo</legend><label class="choice selected"><input type="radio" checked> Compra</label><label class="choice"><input type="radio"> Venda</label></fieldset><div class="form-grid"><label><span>Ativo</span><select><option>AAPL · Americano</option></select></label><label><span>Corretora</span><select><option>Corretora Teste</option></select></label><label><span>Quantidade</span><input type="number" value="3"></label><div class="read-only"><span>Mercado</span><b>Americano · USD</b></div></div><div class="form-note">Preço consultado no envio. Nenhuma ordem será executada.</div><button class="primary wide">Revisar compra</button></article><article class="surface activity"><div class="section-head"><div><span class="kicker">HISTÓRICO</span><h2>Movimentações</h2></div><button class="icon-button">${icon('refresh')}</button></div><details class="compact-filter"><summary>Filtros avançados <span>Nenhum ativo ${icon('chevron')}</span></summary><div class="filters"><label><span>Tipo</span><select><option>Todos</option></select></label><label><span>Ticker</span><input></label><label><span>Desde</span><input type="date"></label><button class="primary">Filtrar</button></div></details><div class="timeline"><div><i class="sell">↑</i><p><b>Venda de PETR4</b><small>2 × R$ 20,00 · Hoje, 02:40</small></p><span>Corretora Teste</span></div><div><i>↓</i><p><b>Compra de AAPL</b><small>3 × US$ 100,00 · Hoje, 02:40</small></p><span>Corretora Teste</span></div><div><i>↓</i><p><b>Compra de PETR4</b><small>12 × R$ 20,00 · Hoje, 02:40</small></p><span>Corretora Teste</span></div></div></article></div></main>`);

    const login = () => `<main class="login"><section class="login-brand"><div class="brand"><span class="atlas-mark"><i></i></span><span><b>Atlas</b><small>Carteira</small></span></div><div class="login-story"><span>CARTEIRA COM CONTEXTO</span><h1>Veja o que você tem.<br>Entenda o que está disponível.</h1><p>Posições, operações simuladas e origem dos dados em uma experiência segura.</p><ul><li>Valores calculados pelo backend</li><li>Disponibilidade sempre explícita</li><li>Nenhuma ordem enviada ao mercado</li></ul></div><small>Ambiente acadêmico · Dados simulados</small></section><section class="login-access"><div><span class="prototype-label">Acesso administrativo</span><h2>Entre no Atlas</h2><p>Acesse sua carteira simulada.</p><form><label><span>Usuário</span><input placeholder="Informe seu usuário"></label><label><span>Senha</span><div class="password"><input type="password" placeholder="Informe sua senha"><button>Mostrar</button></div></label><button class="primary wide">Entrar com segurança</button></form><details><summary>Como protegemos este acesso ${icon('chevron')}</summary><p>A sessão usa cookie HttpOnly e a aplicação não armazena sua senha no navegador.</p></details><p class="academic">Sistema acadêmico. Não executa ordens nem oferece recomendações.</p></div></section></main>`;

    document.querySelector('#app').innerHTML = screen === 'login' ? login() : screen === 'operacoes' ? operacoes() : screen === 'carteira' ? carteira() : dashboard();
  </script>
</body>
</html>
